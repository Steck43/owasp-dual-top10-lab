<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" role="img" aria-labelledby="t d">
  <title id="t">Crosswalk flow: matrix row, scenario, fixture oracle, promotion gate</title>
  <desc id="d">A row in docs/crosswalk_matrix.tsv names a scenario. The fixture oracle has a vulnerable path that fails open and a control that closes it. tests/test_demonstrated_gate.py and evidence/receipts/live_promotions.json are the promotion gate.</desc>
  <rect width="860" height="160" fill="#f6f8fa"/>
  <style>
    .box { fill: #ffffff; stroke: #24292f; stroke-width: 1.4; }
    .lab { font: 13px ui-sans-serif, system-ui, sans-serif; fill: #24292f; }
    .small { font: 11px ui-sans-serif, system-ui, sans-serif; fill: #57606a; }
    .edge { stroke: #24292f; stroke-width: 1.3; fill: none; marker-end: url(#arr); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f"/>
    </marker>
  </defs>
  <rect class="box" x="16" y="28" width="180" height="70" rx="6"/>
  <text class="lab" x="106" y="54" text-anchor="middle">Matrix row</text>
  <text class="small" x="106" y="74" text-anchor="middle">crosswalk_matrix.tsv</text>
  <rect class="box" x="230" y="28" width="160" height="70" rx="6"/>
  <text class="lab" x="310" y="54" text-anchor="middle">Scenario</text>
  <text class="small" x="310" y="74" text-anchor="middle">scenarios/</text>
  <rect class="box" x="424" y="28" width="200" height="70" rx="6"/>
  <text class="lab" x="524" y="50" text-anchor="middle">Fixture oracle</text>
  <text class="small" x="524" y="68" text-anchor="middle">vulnerable fails open</text>
  <text class="small" x="524" y="84" text-anchor="middle">control closes it</text>
  <rect class="box" x="658" y="28" width="186" height="70" rx="6"/>
  <text class="lab" x="751" y="50" text-anchor="middle">Promotion gate</text>
  <text class="small" x="751" y="68" text-anchor="middle">test_demonstrated_gate</text>
  <text class="small" x="751" y="84" text-anchor="middle">live_promotions.json</text>
  <path class="edge" d="M196 63 H230"/>
  <path class="edge" d="M390 63 H424"/>
  <path class="edge" d="M624 63 H658"/>
  <text class="small" x="16" y="130">Sources: docs/crosswalk_matrix.tsv, src/labctl/cli.py, src/lab/contain/profile.py check_contain, tests/test_demonstrated_gate.py.</text>
</svg>
